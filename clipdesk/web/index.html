<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClipDesk</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111318'/><path d='M11 9l12 7-12 7z' fill='%235b9dff'/></svg>"
    />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar">
        <header class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="7" fill="#1b2030" />
            <path d="M11 9l12 7-12 7z" fill="#5b9dff" />
          </svg>
          <span class="brand-name">ClipDesk</span>
          <span id="statusPill" class="pill pill-muted" title="Checking…">
            <i class="dot"></i>
          </span>
        </header>

        <nav id="nav" class="nav"></nav>

        <div class="sidebar-foot">
          <div id="notifications"></div>
          <div id="jobsFoot"></div>
          <div id="closeApp"></div>
        </div>
      </aside>

      <main id="main" class="main">
        <div class="loading">Loading…</div>
      </main>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
