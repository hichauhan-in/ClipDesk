# ClipDesk defaults.
#
# Do not edit this file to change your setup — create `config/local.yaml` with
# just the keys you want to override (it is git-ignored and written by the
# Settings screen), or set the matching CLIPDESK_* environment variable.

server:
  host: 127.0.0.1
  port: 8760
  # Extra origins allowed to call the API. Only needed when the UI is served
  # from somewhere other than this server (i.e. when you host it later).
  allowed_origins: []
  # Hard ceiling on an uploaded file, in megabytes.
  max_upload_mb: 4096
  # Hosted deployments must enable this and put ClipDesk behind an authenticating
  # reverse proxy. The proxy removes client-supplied copies of these headers,
  # authenticates the request, then injects both headers on the upstream request.
  multi_user: false
  identity_header: x-clipdesk-user
  proxy_secret_header: x-clipdesk-proxy-secret
  proxy_secret_env: CLIPDESK_PROXY_SECRET
  # Hosted mode denies every outbound link unless its hostname matches one of
  # these exact names or wildcard suffixes (for example *.sharepoint.com).
  allowed_link_hosts: []

paths:
  # Both are resolved relative to the repository root when not absolute.
  workspace: workspace
  vendor: vendor

media:
  # Silence detection. `noise_db` is the level below which audio counts as
  # silent; `min_silence_seconds` is the shortest silence worth reporting.
  noise_db: -32.0
  min_silence_seconds: 0.5
  # Audio handed to speech-to-text. 16 kHz mono is what Whisper expects.
  audio_sample_rate: 16000

transcription:
  # tiny | tiny.en | base | base.en | small | small.en | medium | large-v3
  # `base` is the sweet spot for a corporate laptop: ~150 MB, CPU-only, and
  # accurate enough for topic analysis. Drop to `tiny` on very weak machines.
  model: base
  device: cpu
  compute_type: int8
  # null = auto-detect. Set e.g. "en" to skip detection and save a little time.
  language: null
  beam_size: 1
  vad_filter: true

llm:
  # vscode | copilot_cli | openai_compat | anthropic
  provider: vscode

  vscode:
    # Written by the ClipDesk Bridge VS Code extension. Leave null to use the
    # default location (~/.clipdesk/bridge.json).
    handshake_file: null
    # Overrides the handshake file when set.
    base_url: null
    token: null
    # Copilot model family, e.g. gpt-4o, gpt-4.1, claude-3.5-sonnet.
    # null = whatever the bridge reports as its default.
    model: null
    reasoning_effort: null
    # Optional hard ceiling for input tokens. null = the selected model's limit.
    context_window_tokens: null
    request_timeout_s: 180

  copilot_cli:
    command: copilot
    extra_args: ["--no-color"]
    model: null
    reasoning_effort: null
    context_window: default
    request_timeout_s: 300

  # Any endpoint speaking the OpenAI chat-completions shape. The Settings screen
  # fills these in from a preset (OpenAI, Azure OpenAI, Gemini, OpenRouter,
  # Ollama, or a custom gateway).
  openai_compat:
    preset: custom
    base_url: null            # e.g. https://<resource>.openai.azure.com/openai/v1
    api_key_env: CLIPDESK_LLM_API_KEY
    model: gpt-4o
    # "bearer" (OpenAI style) or "api-key" (Azure OpenAI style)
    auth_style: bearer
    request_timeout_s: 180

  # Claude has its own API shape, so it gets its own adapter.
  anthropic:
    base_url: https://api.anthropic.com
    api_key_env: CLIPDESK_ANTHROPIC_API_KEY
    model: claude-sonnet-4-5
    max_tokens: 8192
    request_timeout_s: 180

ingest:
  # Reuse the sign-in from this browser when a link needs one — the usual case
  # for SharePoint and Stream. One of: edge, chrome, firefox, brave, vivaldi,
  # opera, safari. Empty means never use browser cookies.
  # The browser must be fully closed: it locks its cookie store while running.
  browser_cookies: ""
  # Refuse a download larger than this, so a mistyped link cannot fill the disk.
  # 0 means no limit.
  max_download_mb: 8192

analysis:
  # Characters of transcript sent to the model per call. Smaller = more calls
  # but less chance of hitting a context limit on a small model.
  window_chars: 9000
  window_overlap_chars: 600
  # Max concurrent LLM calls. Keep low — you are sharing a Copilot quota.
  max_concurrency: 2
  # Retries for a call that returns unparseable JSON.
  json_retries: 2
  # A segment is kept by cleanup when its importance reaches this.
  keep_importance_threshold: 0.38
  filler_words:
    - um
    - uh
    - erm
    - hmm
    - like
    - you know
    - i mean
    - sort of
    - kind of
    - basically
    - actually
    - right
    - okay so
    - anyway

cleanup:
  # Silences shorter than this are left alone — removing them makes speech
  # sound clipped and unnatural.
  keep_gap_seconds: 1.0
  # Padding kept on each side of a retained span so words are never clipped.
  pad_seconds: 0.25
  # Merge two kept spans separated by less than this.
  merge_gap_seconds: 0.8
  smooth_cuts: true
  fade_seconds: 0.25
  # Only fade when at least this many seconds were removed at the join.
  fade_min_gap_seconds: 4.0

clips:
  # Default target length when the user does not give one.
  default_duration_seconds: 90
  # How far the picker may stray from the requested duration.
  duration_tolerance: 0.25
  # Seconds of lead-in/lead-out kept around a chosen clip.
  pad_seconds: 0.4
  # Number of highlight clips produced by the "highlights" action.
  highlight_count: 5
  highlight_max_seconds: 60

render:
  video_codec: libx264
  preset: veryfast
  crf: 21
  audio_codec: aac
  audio_bitrate: 160k
  # 16:9 canvas used by highlights and by bookend normalisation.
  width: 1920
  height: 1080
  fps: null                   # null = keep the source frame rate

notes:
  # Chapters grouped into one notes file. Larger = fewer, longer documents.
  chapters_per_file: 6
  include_mermaid: true
  include_timestamps: true
  # How much the model may add beyond what was actually said:
  #   0 transcript_only - nothing that is not in the recording
  #   1 clarify         - define jargon and expand acronyms used in the talk
  #   2 context         - add short background so a newcomer can follow
  #   3 complete        - fill genuine gaps in the topic to make a standalone guide
  # Anything above 0 is clearly marked in the output, so a reader can always tell
  # what was said from what the model supplied.
  enrichment: 0  # How much the model may add beyond what was actually said:
  #   0 transcript_only - nothing that is not in the recording
  #   1 clarify         - define jargon and expand acronyms used in the talk
  #   2 context         - add short background so a newcomer can follow
  #   3 complete        - fill genuine gaps in the topic to make a standalone guide
  # Anything above 0 is clearly marked in the output, so a reader can always tell
  # what was said from what the model supplied.
  enrichment: 0
logging:
  level: INFO
  file: null                  # path to a log file, or null for console only
